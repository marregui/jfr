name: build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its run in progress; every push to master is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The JFR-backed tests record in-process; they assert verdicts and orders of magnitude,
      # not exact durations, so they hold on a shared runner. check also runs doclint over the
      # Javadoc and Checkstyle for unused imports.
      - run: ./gradlew build installDist
      # What ran, per module, in the job summary. On Linux and macOS every test can run, so a
      # skip there fails the job; Windows skips the tests that need pthreads or POSIX permissions.
      - name: Test report
        if: success() || failure()
        shell: bash
        run: java ci/TestReport.java ${{ runner.os != 'Windows' && '--no-skips' || '' }}
      # The installed launchers on a live JVM: jfrq-live attaches, records, dumps, and every
      # command answers on the dumps.
      - name: Smoke test
        shell: bash
        run: java -cp core/build/libs/core-*-test-fixtures.jar ci/Smoke.java live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/test/
            build/smoke/
          if-no-files-found: ignore

  # A recording an older JDK made, read by this one: event fields and settings differ (JDK 21's
  # profile leaves jdk.JavaExceptionThrow off), and every test records with JDK 25 in-process.
  jdk21-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # The last one listed is JAVA_HOME; the other is JAVA_HOME_21_X64.
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew installDist testFixturesJar
      - name: Record with JDK 21
        run: |
          "$JAVA_HOME_21_X64/bin/java" -version
          "$JAVA_HOME_21_X64/bin/java" -XX:StartFlightRecording=settings=profile,filename=build/jdk21.jfr ci/Workload.java 25
      - name: Read it with jfrq
        run: java -cp core/build/libs/core-*-test-fixtures.jar ci/Smoke.java offline build/jdk21.jfr --jdk21
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: jdk21-recording
          path: build/jdk21.jfr
          if-no-files-found: ignore
